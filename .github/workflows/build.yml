name: "🔨 Build Begonia Kernel with KernelSU-Next & SuSFS"

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch (fourteen: Android 14 [recommended], aosp-13: Android 13, fifteen: Android 15)"
        required: true
        default: "fourteen"
        type: choice
        options:
          - "fourteen"
          - "aosp-13"
          - "fifteen"
      su_variant:
        description: "Root & SuSFS Variant to build"
        required: true
        default: "ksun_uapi6_susfs"
        type: choice
        options:
          - "ksun_uapi6_susfs"
          - "ksun_uapi5_susfs"
          - "ksun_uapi6_nosusfs"
          - "ksun_uapi5_nosusfs"
          - "vanilla"
      make_release:
        description: "Publish/Attach build to GitHub Release"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "GitHub Release Tag to publish/update"
        required: false
        type: string
        default: "Revision-1"

jobs:
  build:
    name: "🐎 Build Begonia (${{ inputs.kernel_branch }} | ${{ inputs.su_variant }})"
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: "🧹 Free runner disk space"
        run: |
          echo "=== Freeing runner disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: "📥 Checkout builder repository"
        uses: actions/checkout@v4

      - name: "📦 Install build dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex \
            libssl-dev libelf-dev libfl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            curl git zip unzip python3 ccache perl jq wget
          sudo apt-get install -y libtinfo5 || true

      - name: "💾 Setup swap memory (16G)"
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: "🔧 Clone Clang toolchain (crDroid Clang 15)"
        run: |
          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 \
            $GITHUB_WORKSPACE/clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: "📥 Clone kernel source"
        run: |
          echo "=== Cloning xiaomi-begonia-dev/android_kernel_xiaomi_mt6785 branch ${{ inputs.kernel_branch }} ==="
          git clone --depth=1 \
            --branch ${{ inputs.kernel_branch }} \
            https://github.com/xiaomi-begonia-dev/android_kernel_xiaomi_mt6785 \
            kernel_source
          cd kernel_source
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: "🌿 Integrate KernelSU-Next (v3.4.2)"
        run: |
          VARIANT="${{ inputs.su_variant }}"
          if [ "$VARIANT" = "vanilla" ]; then
            echo "Vanilla build selected: skipping KernelSU-Next integration."
            exit 0
          fi

          echo "=== Fetching KernelSU-Next v3.4.2 ==="
          git clone --depth=1 --filter=blob:none --sparse -b floppy-unity https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git /tmp/flop_ksu
          cd /tmp/flop_ksu
          git sparse-checkout set drivers/kernelsu
          cp -r drivers/kernelsu $GITHUB_WORKSPACE/kernel_source/drivers/
          rm -rf /tmp/flop_ksu
          cd $GITHUB_WORKSPACE/kernel_source

          if [ "$VARIANT" = "ksun_uapi5_susfs" ] || [ "$VARIANT" = "ksun_uapi5_nosusfs" ]; then
            echo "Configuring UAPI version 5..."
            sed -i 's/#define KERNEL_SU_UAPI_VERSION 6/#define KERNEL_SU_UAPI_VERSION 5/' drivers/kernelsu/uapi/supercall.h
            sed -i 's/KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := 33355/' drivers/kernelsu/kernel/Kbuild
          else
            echo "Configuring UAPI version 6..."
            sed -i 's/#define KERNEL_SU_UAPI_VERSION 5/#define KERNEL_SU_UAPI_VERSION 6/' drivers/kernelsu/uapi/supercall.h
            sed -i 's/KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := 33553/' drivers/kernelsu/kernel/Kbuild
          fi

          echo "✅ KernelSU-Next v3.4.2 integrated"

      - name: "🛡️ Patch Kernel Source & SuSFS (v2.2.0)"
        run: |
          VARIANT="${{ inputs.su_variant }}"
          cd $GITHUB_WORKSPACE
          
          echo "=== Running patch_begonia.py ==="
          python3 scripts/patch_begonia.py kernel_source patches

          if [ "$VARIANT" = "ksun_uapi6_nosusfs" ] || [ "$VARIANT" = "ksun_uapi5_nosusfs" ] || [ "$VARIANT" = "vanilla" ]; then
            echo "Disabling SuSFS in kernel tree for no-susfs variant..."
            sed -i 's/obj-\$(CONFIG_KSU_SUSFS) += susfs.o/# obj-\$(CONFIG_KSU_SUSFS) += susfs.o/' kernel_source/fs/Makefile || true
          fi

      - name: "⚙️ Configure defconfig"
        working-directory: kernel_source
        run: |
          DEFCONFIG="arch/arm64/configs/begonia_user_defconfig"
          VARIANT="${{ inputs.su_variant }}"

          # Always enable KPROBES & OVERLAY_FS
          scripts/config --file "$DEFCONFIG" -e KPROBES
          scripts/config --file "$DEFCONFIG" -e KPROBE_EVENTS
          scripts/config --file "$DEFCONFIG" -e OVERLAY_FS

          if [ "$VARIANT" != "vanilla" ]; then
            echo "Enabling KernelSU configs..."
            scripts/config --file "$DEFCONFIG" -e KSU
            scripts/config --file "$DEFCONFIG" -e KSU_NEXT

            if [ "$VARIANT" = "ksun_uapi6_susfs" ] || [ "$VARIANT" = "ksun_uapi5_susfs" ]; then
              echo "Enabling SuSFS configs..."
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SUS_PATH
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SUS_MOUNT
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SUS_KSTAT
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_TRY_UMOUNT
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SPOOF_UNAME
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_ENABLE_LOG
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_OPEN_REDIRECT
              scripts/config --file "$DEFCONFIG" -e KSU_SUSFS_SUS_MAP
            fi
          fi

          echo "=== Configured parameters ==="
          grep -E "CONFIG_KSU|CONFIG_SUSFS|CONFIG_KPROBE|CONFIG_OVERLAY_FS" "$DEFCONFIG" || true

      - name: "⚙️ Generate .config"
        working-directory: kernel_source
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=$GITHUB_WORKSPACE/out \
            begonia_user_defconfig

      - name: "🏗️ Compile Begonia Kernel"
        working-directory: kernel_source
        run: |
          set -o pipefail
          START_TIME=$(date +%s)
          
          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            O=$GITHUB_WORKSPACE/out \
            2>&1 | tee $GITHUB_WORKSPACE/build.log

          END_TIME=$(date +%s)
          echo "Compilation finished in $((END_TIME - START_TIME)) seconds."

      - name: "📦 Package AnyKernel3 flashable zip"
        run: |
          BOOT_DIR="$GITHUB_WORKSPACE/out/arch/arm64/boot"
          KERNEL_IMG=""
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT_DIR/$img" ]; then
              KERNEL_IMG="$BOOT_DIR/$img"
              echo "✅ Found kernel image: $img"
              break
            fi
          done

          if [ -z "$KERNEL_IMG" ]; then
            echo "❌ No kernel image found in $BOOT_DIR!"
            ls -la "$BOOT_DIR" || true
            exit 1
          fi

          echo "=== Cloning & Configuring AnyKernel3 ==="
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 $GITHUB_WORKSPACE/AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3
          rm -f LICENSE README.md

          # Copy AnyKernel3 configuration for Begonia
          cp $GITHUB_WORKSPACE/templates/anykernel.sh anykernel.sh
          cp "$KERNEL_IMG" ./

          mkdir -p $GITHUB_WORKSPACE/output
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          VARIANT="${{ inputs.su_variant }}"
          BRANCH="${{ inputs.kernel_branch }}"

          case "$VARIANT" in
            ksun_uapi6_susfs)
              VARIANT_TAG="KSUNext-v3.4.2-uapi6-SuSFS-v2.2"
              ;;
            ksun_uapi5_susfs)
              VARIANT_TAG="KSUNext-v3.4.2-uapi5-SuSFS-v2.2"
              ;;
            ksun_uapi6_nosusfs)
              VARIANT_TAG="KSUNext-v3.4.2-uapi6-NoSuSFS"
              ;;
            ksun_uapi5_nosusfs)
              VARIANT_TAG="KSUNext-v3.4.2-uapi5-NoSuSFS"
              ;;
            vanilla)
              VARIANT_TAG="Vanilla-APatch-Ready"
              ;;
            *)
              VARIANT_TAG="$VARIANT"
              ;;
          esac

          ZIP_NAME="Begonia-${BRANCH}-${VARIANT_TAG}-${BUILD_DATE}"
          zip -r9 "$GITHUB_WORKSPACE/output/${ZIP_NAME}.zip" . -x '*.git*' '*.github*' '*placeholder'

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "VARIANT_TAG=${VARIANT_TAG}" >> $GITHUB_ENV
          echo "✅ Successfully packaged: ${ZIP_NAME}.zip"

      - name: "📥 Download matching Manager APKs"
        run: |
          cd $GITHUB_WORKSPACE/output
          echo "=== Downloading Matching Manager APKs ==="
          
          wget -q -c "https://github.com/hpbzareth/flop-trinket-ksun-susfs/releases/download/Revision-1/KernelSU_Next_v3.4.2_uapi6-33553-release.apk" || true
          wget -q -c "https://github.com/hpbzareth/flop-trinket-ksun-susfs/releases/download/Revision-1/KernelSU_Next_v3.4.2_uapi5-33355-release.apk" || true
          wget -q -c "https://github.com/hpbzareth/flop-trinket-ksun-susfs/releases/download/Revision-1/APatch_11282_e8e4651_HEAD-release-signed.apk" || true

          # Generate SHA256 checksums
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: "📤 Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ZIP_NAME }}"
          path: output/*
          retention-days: 14

      - name: "📋 Upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "build-log-begonia-${{ github.run_id }}"
          path: build.log
          retention-days: 7

      - name: "🚀 Publish to GitHub Releases"
        if: inputs.make_release == true && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ inputs.release_tag }}"
          BRANCH="${{ inputs.kernel_branch }}"
          VARIANT_TAG="${{ env.VARIANT_TAG }}"
          
          echo "=== Publishing to GitHub Release: $RELEASE_TAG ==="
          
          RELEASE_TITLE="Redmi Note 8 Pro (Begonia) Kernel — $RELEASE_TAG"
          
          echo "Redmi Note 8 Pro (Begonia) Custom Kernel build with KernelSU-Next v3.4.2 and SuSFS v2.2.0" > /tmp/release_notes.txt
          echo "Branch: ${BRANCH} | Variant: ${VARIANT_TAG}" >> /tmp/release_notes.txt

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" output/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file /tmp/release_notes.txt
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" output/* \
              --title "$RELEASE_TITLE" \
              --notes-file /tmp/release_notes.txt
          fi
          echo "✅ Release $RELEASE_TAG published successfully!"
