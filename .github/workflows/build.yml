name: "🔨 Build Begonia Kernel"

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "aosp-13"
        type: choice
        options:
          - aosp-13
          - fourteen
          - fifteen

jobs:
  build:
    name: "🐎 Build Kernel"
    runs-on: ubuntu-22.04

    steps:
      - name: "📦 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex \
            libssl-dev libfl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            curl git zip unzip python3 ccache

      - name: "🔧 Clone Clang toolchain"
        run: |
          git clone --depth=1 \
            --branch 15.0 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 \
            clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: "📥 Clone kernel source"
        run: |
          git clone --depth=1 \
            --branch ${{ github.event.inputs.kernel_branch }} \
            https://github.com/xiaomi-begonia-dev/android_kernel_xiaomi_mt6785 \
            kernel_source

      - name: "🌿 Integrate KernelSU-Next (legacy)"
        working-directory: kernel_source
        run: |
          # Clone KernelSU-Next legacy vào thư mục KernelSU-Next
          git clone --depth=1 \
            --branch legacy \
            https://github.com/sidex15/KernelSU-Next \
            KernelSU-Next

          # Chạy setup.sh → tạo drivers/kernelsu symlink + patch Makefile/Kconfig
          bash KernelSU-Next/kernel/setup.sh

          # Apply manual hooks vào kernel source (bắt buộc với non-GKI kernel 4.14)
          # KSU cung cấp sẵn patch file cho manual hook
          HOOK_PATCH="KernelSU-Next/kernel/manual_hook.patch"
          if [ -f "$HOOK_PATCH" ]; then
            echo "Applying manual hook patch..."
            patch -p1 < "$HOOK_PATCH"
          else
            # Fallback: apply hooks thủ công vào các file cần thiết
            echo "No patch file found, applying hooks manually..."

            # Hook vào fs/exec.c - execve hook
            if grep -q "int __do_execve_file" fs/exec.c 2>/dev/null || grep -q "static int do_execveat_common" fs/exec.c 2>/dev/null; then
              curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy/kernel/compat/patches/exec.patch" | patch -p1 --forward || true
            fi

            # Hook vào fs/open.c - faccessat hook  
            curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy/kernel/compat/patches/open.patch" | patch -p1 --forward || true

            # Hook vào fs/read_write.c - read hook
            curl -LSs "https://raw.githubusercontent.com/sidex15/KernelSU-Next/legacy/kernel/compat/patches/read_write.patch" | patch -p1 --forward || true
          fi

          # Pastikan CONFIG_KSU_MANUAL_HOOK aktif
          CFG="arch/arm64/configs/begonia_user_defconfig"
          set_cfg() {
            local key="$1"
            if grep -q "# $key is not set" "$CFG"; then
              sed -i "s/# $key is not set/$key=y/" "$CFG"
            elif ! grep -q "^$key=" "$CFG"; then
              echo "$key=y" >> "$CFG"
            fi
          }
          set_cfg CONFIG_KSU
          set_cfg CONFIG_KSU_MANUAL_HOOK

          echo "✅ KSU $(git -C KernelSU-Next describe --tags 2>/dev/null) integrated"
          grep "^CONFIG_KSU" arch/arm64/configs/begonia_user_defconfig

      - name: "🗜️ Clone AnyKernel3"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -f AnyKernel3/{LICENSE,README.md}

      - name: "⚙️ Generate defconfig"
        working-directory: kernel_source
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=$GITHUB_WORKSPACE/out \
            begonia_user_defconfig

      - name: "🏗️ Build kernel"
        working-directory: kernel_source
        run: |
          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=$GITHUB_WORKSPACE/out \
            2>&1 | tee $GITHUB_WORKSPACE/build.log

      - name: "📦 Package AnyKernel3 zip"
        run: |
          BOOT_DIR="$GITHUB_WORKSPACE/out/arch/arm64/boot"

          echo "Contents of boot dir:"
          ls "$BOOT_DIR" || { echo "Boot dir not found!"; exit 1; }

          KERNEL_IMG=""
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT_DIR/$img" ]; then
              KERNEL_IMG="$BOOT_DIR/$img"
              echo "✅ Found: $img"
              break
            fi
          done

          [ -z "$KERNEL_IMG" ] && { echo "❌ No kernel image!"; exit 1; }

          cp "$KERNEL_IMG" AnyKernel3/

          BUILD_DATE=$(date +%Y%m%d-%H%M)
          KSU_VER=$(git -C kernel_source/KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo "KSU")
          ZIP_NAME="Begonia-${{ github.event.inputs.kernel_branch }}-${KSU_VER}-${BUILD_DATE}"

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/${ZIP_NAME}.zip" . -x '*.git*' '*.github*' '*placeholder'

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "✅ Done: ${ZIP_NAME}.zip"

      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 7

      - name: "📋 Upload build log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "build-log-${{ github.run_id }}"
          path: build.log
          retention-days: 3
